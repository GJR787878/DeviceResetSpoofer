plugins {
    id 'com.android.application'
}

// 统一签名：本地与CI使用同一keystore，保证覆盖安装/升级
def keystorePath = System.getenv("DRS_KEYSTORE_PATH") ?: "keystore/devicereset-release.keystore"
def keystorePass = System.getenv("DRS_KEYSTORE_PASS") ?: "DRS_Key_2026!"

android {
    namespace 'io.github.gjr787878.devicereset'
    compileSdk 34

    defaultConfig {
        applicationId "io.github.gjr787878.devicereset"
        minSdk 24
        targetSdk 34
        versionCode 28
        versionName "2.8"
    }

    signingConfigs {
        release {
            // rootProject.file: 相对仓库根解析(keystore/目录在仓库根)
            storeFile rootProject.file(keystorePath)
            storePassword keystorePass
            keyAlias "devicereset"
            keyPassword keystorePass
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.release
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
    }
}

dependencies {
    compileOnly files('libs/api-82.jar')
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
}
